name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check backend health
        shell: bash
        run: |
          node backend_api.js > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill $backend_pid' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1
